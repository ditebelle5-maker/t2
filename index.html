<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>R4 Academy</title>
    <script>
      // Corrige o problema do modo escuro configurando o Tailwind CSS para usar a estratégia de 'class'.
      // Isso permite que o JavaScript controle o tema adicionando/removendo a classe 'dark' do <html>.
      tailwind.config = {
        darkMode: 'class',
      }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .animate-fade-in {
        animation: fade-in 0.5s ease-in-out;
      }
      @keyframes fade-in-up {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
      }
      .animate-fade-in-up {
          opacity: 0;
          animation: fade-in-up 0.6s ease-out forwards;
      }
      @keyframes fade-in-up-fast {
        from {
          opacity: 0;
          transform: translateY(10px) scale(0.95);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .animate-fade-in-up-fast {
        animation: fade-in-up-fast 0.15s ease-out;
      }

      @keyframes fade-in-from-bottom {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .animate-fade-in-from-bottom {
        opacity: 0;
        animation: fade-in-from-bottom 0.6s ease-out forwards;
      }

      .animation-delay-200 { animation-delay: 0.2s; }
      .animation-delay-400 { animation-delay: 0.4s; }
      .animation-delay-600 { animation-delay: 0.6s; }
      .animation-delay-800 { animation-delay: 0.8s; }

      @keyframes move-grid {
        from {
          background-position: 0 0;
        }
        to {
          background-position: -60px -60px;
        }
      }
      
      .dark-bg-grid {
        background-image:
          linear-gradient(rgba(255,255,255,.07) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,.07) 1px, transparent 1px);
        background-size: 30px 30px;
        background-position: center;
        animation: move-grid 8s linear infinite;
      }
      
      @keyframes aurora {
        from {
          background-position: 50% 50%, 50% 50%;
        }
        to {
          background-position: 350% 50%, 350% 50%;
        }
      }
      
      .aurora-bg {
        position: relative;
        overflow: hidden;
      }

      .aurora-bg::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-image: radial-gradient(ellipse at center, rgba(16, 185, 129, 0.2), transparent 80%), radial-gradient(ellipse at center, rgba(99, 102, 241, 0.2), transparent 80%);
        mix-blend-mode: color-dodge;
        animation: aurora 20s linear infinite;
        z-index: 1;
        pointer-events: none;
      }
      
      /* Garante que o conteúdo fique acima do efeito de fundo */
      .aurora-bg > * {
          position: relative;
          z-index: 2;
      }

    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.28.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
